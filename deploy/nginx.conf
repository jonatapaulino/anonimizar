# Terminador TLS/mTLS do nó — ÚNICA superfície exposta (borda).
# Identidade: certificado de cliente do órgão chamador -> CN ->
# header X-Cliente-Orgao (app/deps.py confia nela porque o compose
# garante que só este nginx alcança a rede `interna`).
#
# A cifragem E2E (application/x-e2e) convive com o TLS do canal:
# TLS protege o hop até a borda; o envelope AEAD atravessa a borda
# intocado — o claro só existe dentro do contêiner da API.

server {
    listen 443 ssl;
    http2 on;

    # --- TLS 1.3 estrito + mTLS (ADR-0007) ---
    ssl_protocols       TLSv1.3;
    ssl_certificate     /etc/nginx/certs/node.crt;
    ssl_certificate_key /etc/nginx/certs/node.key;
    ssl_client_certificate /etc/nginx/certs/ca.crt;   # CA dos pares
    ssl_verify_client     on;
    ssl_verify_depth      2;
    ssl_session_cache     shared:MTLS:10m;
    ssl_session_timeout   10m;

    # CN do certificado do cliente = identidade do órgão.
    # Ex.: "CN=tjpa,O=Poder Judiciario" -> extrai "tjpa".
    map $ssl_client_s_dn $orgao {
        ~CN=(?<cn>[^,]+)  $cn;
        default           "";
    }

    # Headers reforçados — superfície mínima, sem banners.
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store" always;
    client_max_body_size 0;   # streaming — sem limite de corpo

    location / {
        # Identidade autenticada repassada à API (rede `interna`).
        proxy_set_header X-Cliente-Orgao $orgao;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
        # nunca propagar credencial de cliente do chamador
        proxy_set_header Authorization "";
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;      # streaming de upload
        proxy_buffering off;              # streaming de download
        proxy_read_timeout 3600s;
    }
}
